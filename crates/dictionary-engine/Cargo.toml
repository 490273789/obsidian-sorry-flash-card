[package]
name = 'dictionary-engine'
version = '2.0.6'
edition = '2021'
license = '0BSD'
publish = false

[lib]
crate-type = ['cdylib', 'rlib']

[dependencies]
encoding_rs = '0.8.35'
fst = { version = '0.4.7', features = ['levenshtein'] }
lzokay = '2.0.1'
miniz_oxide = '0.9.1'
quick-xml = '0.38.3'
ripemd = '0.1.3'
serde = { version = '1.0.228', features = ['derive'] }
serde_json = '1.0.149'
sha2 = '0.10.9'
unicode-normalization = '0.1.25'
wasm-bindgen = '0.2.108'

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = '0.3.85'

[dev-dependencies]
base64 = '0.22.1'
