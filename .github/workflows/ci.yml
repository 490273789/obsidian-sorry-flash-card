name: CI

on:
    push:
        branches: ["**"]
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
              with:
                  version: 11.25.0
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run check:all
            - run: pnpm build
            - uses: actions/upload-artifact@v6
              with:
                  name: obsidian-study-studio-${{ github.sha }}
                  path: |
                      main.js
                      manifest.json
                      styles.css
                  if-no-files-found: error
